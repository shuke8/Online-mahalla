<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pattern Export</title>
<style>
body { margin: 0; }
.tile {
  width: 250px;
  height: 250px;
  background-color: #f0f4f8;
  background-image:
    linear-gradient(67.5deg, #dce8f5 10%, transparent 10%),
    linear-gradient(157.5deg, #dce8f5 10%, transparent 10%),
    linear-gradient(67.5deg, transparent 90%, #dce8f5 90%),
    linear-gradient(157.5deg, transparent 90%, #dce8f5 90%),
    linear-gradient(22.5deg, #dce8f5 10%, transparent 10%),
    linear-gradient(112.5deg, #dce8f5 10%, transparent 10%),
    linear-gradient(22.5deg, transparent 90%, #dce8f5 90%),
    linear-gradient(112.5deg, transparent 90%, #dce8f5 90%),
    linear-gradient(22.5deg, transparent 33%, rgba(220,232,245,0.6) 33%, rgba(220,232,245,0.6) 36%, transparent 36%, transparent 64%, rgba(220,232,245,0.6) 64%, rgba(220,232,245,0.6) 67%, transparent 67%),
    linear-gradient(-22.5deg, transparent 33%, rgba(220,232,245,0.6) 33%, rgba(220,232,245,0.6) 36%, transparent 36%, transparent 64%, rgba(220,232,245,0.6) 64%, rgba(220,232,245,0.6) 67%, transparent 67%),
    linear-gradient(112.5deg, transparent 33%, rgba(220,232,245,0.6) 33%, rgba(220,232,245,0.6) 36%, transparent 36%, transparent 64%, rgba(220,232,245,0.6) 64%, rgba(220,232,245,0.6) 67%, transparent 67%),
    linear-gradient(-112.5deg, transparent 33%, rgba(220,232,245,0.6) 33%, rgba(220,232,245,0.6) 36%, transparent 36%, transparent 64%, rgba(220,232,245,0.6) 64%, rgba(220,232,245,0.6) 67%, transparent 67%);
  background-size: 250px 250px;
  background-position:
    -100px 150px, -150px 150px, -150px 100px, -100px 100px,
    -150px 100px, -100px 100px, -100px 150px, -150px 150px,
    0 0, 0 0, 0 0, 0 0;
}
</style>
</head>
<body>
<div class="tile" id="tile"></div>
<script>
// Canvas export
const el = document.getElementById('tile');
const canvas = document.createElement('canvas');
canvas.width = 500;
canvas.height = 500;

import('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.esm.min.js')
  .catch(() => {
    // fallback: use html2canvas from script tag
  });
</script>
</body>
</html>
