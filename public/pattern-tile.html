    linear-gradient(157.5deg, transparent 90%, #dce8f5 90%),
    linear-gradient(22.5deg, #dce8f5 10%, transparent 10%),
    linear-gradient(112.5deg, #dce8f5 10%, transparent 10%),
    linear-gradient(22.5deg, transparent 90%, #dce8f5 90%),
    linear-gradient(112.5deg, transparent 90%, #dce8f5 90%),
