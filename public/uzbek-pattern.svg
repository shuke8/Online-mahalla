<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- 8-pointed star (girih) — two overlapping squares -->
  <g fill="none" stroke="#2b8cee" stroke-opacity="0.16" stroke-width="1.1">
    <rect x="22" y="22" width="56" height="56"/>
    <rect x="22" y="22" width="56" height="56" transform="rotate(45 50 50)"/>
  </g>
  <!-- inner diamond -->
  <g fill="none" stroke="#2b8cee" stroke-opacity="0.12" stroke-width="1">
    <rect x="40" y="40" width="20" height="20" transform="rotate(45 50 50)"/>
  </g>
  <!-- connecting dots (tile-edge + center) -->
  <g fill="#2b8cee" fill-opacity="0.13">
    <circle cx="0" cy="0" r="1.8"/>
    <circle cx="100" cy="0" r="1.8"/>
    <circle cx="0" cy="100" r="1.8"/>
    <circle cx="100" cy="100" r="1.8"/>
    <circle cx="50" cy="50" r="1.5"/>
  </g>
</svg>
